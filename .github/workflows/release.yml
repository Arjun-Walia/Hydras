name: Release desktop

# Builds the Windows installers and attaches them to a DRAFT GitHub release.
# Trigger by pushing a tag like v0.1.0, or run it manually from the Actions tab.
# Nothing is published until you review and publish the draft yourself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @hydras/web build
      - run: node scripts/package-lan.mjs
      - run: node scripts/collaboration-integration.mjs
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SYNC_URL: ${{ vars.VITE_SYNC_URL }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Hydras v__VERSION__
          releaseBody: Windows installer (.exe) and MSI. See the README for the sync server setup.
          releaseDraft: true
          prerelease: false

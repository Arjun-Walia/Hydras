# Fly.io config for the Hydras sync server (apps/server).
#   fly launch --no-deploy --copy-config   # first time: pick an app name + region
#   fly volumes create hydras_data --size 1
#   fly deploy
# Then point the web app at it: VITE_SYNC_URL=wss://<app>.fly.dev

app = "hydras-sync"

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  PORT = "8080"
  SQLITE_PATH = "/data/hydras.sqlite"

[[mounts]]
  source = "hydras_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # WebSockets hold rooms in memory: keep one machine always running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

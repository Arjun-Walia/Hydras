[package]
name = "hydras-desktop"
version = "0.2.0"
description = "Hydras: offline-first multiplayer code workspace"
edition = "2021"
publish = false

[lib]
name = "hydras_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ignore = "0.4.34"
notify = "8.2.2"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
